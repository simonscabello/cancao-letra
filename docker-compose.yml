version: "3.7"

services:
  backend:
    image: docker.ntag.fr/ovhlyrics:latest
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 500M
          cpus: "0.5"
      replicas: 2
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
